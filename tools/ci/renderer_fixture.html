<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cogame-halite renderer fixture — worst-case LLM text</title>
<!--
  Why this file exists (cogchemists, 2026-08-24): tools/ci/docker_smoke.sh runs
  with NO ANTHROPIC_API_KEY, so every seat plays the scripted baseline and the
  replay CI produces carries ZERO LLM text. Nothing that plays that replay can
  draw the feed's speech chrome, so a note anchored where there is no room --
  drawn at a negative coordinate, clipped to a sliver -- passes every other
  gate. This fixture is the only one that exercises it.

  Why it loads the SHIPPED page (particle-worlds, 2026-08-26): a fixture that
  re-implements the drawing proves nothing about the bundle. This one loads
  dist/static-replay-viewer/index.html in THREE iframes -- one per canvas size
  -- with `?shim=1`, whose ONLY effect is to skip the wasm entry so the page's
  own chrome, CSS and text path run unchanged. Each iframe is fed a replay
  whose every seat carries a FULL-CAP 140-rune note on many turns, and the
  fixture then TRANSCRIBES each page's own DOM text runs onto a canvas at the
  measured geometry, so viewer_smoke.mjs's fillText hook measures the real,
  shipped layout at three sizes.

  THREE FIXED IFRAMES, NOT ONE RESIZED ONE. Resizing an iframe updates the
  child's clientWidth immediately but redoes its line breaking on the CHILD's
  own rendering lifecycle; measuring across that gap transcribes the wide
  layout's line boxes into the narrow frame and reports the difference as
  "text with nowhere to go". Every size gets its own frame, sized before it
  ever loads, so there is no resize to race.

  Run (see .github/workflows/ci.yml):
    node tools/ci/viewer_smoke.mjs --url \
      "http://127.0.0.1:8731/renderer_fixture.html?replay=%2Fsmoke.replay" \
      --timeout 90 --strict-text-bounds --soak 8 --out dist/fixture

  The soak is NOT decoration. viewer_smoke.mjs accepts the bridge `ready`
  postMessage OR data-replay-loaded, whichever comes FIRST, and the shipped
  page inside an iframe posts `ready` within ~300 ms -- before this fixture has
  transcribed anything. Without the soak the run ended with
  `canvas_text.total == 0` and the text gate was vacuous. The soak keeps the
  page alive while the passes run, and ci.yml then asserts the count is
  non-zero.
-->
<style>
@font-face {
  /* The same face the bundle's chrome uses, so the parent document resolves
     the same family list the iframes do. */
  font-family: 'rajdhani';
  src: url('./font.ttf') format('truetype');
  font-display: block;
}
  html, body { margin: 0; padding: 0; background: #0b0805; color: #f2e8d8;
               font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
  /* The three frames overlap at the origin: each still gets a full, independent
     layout at its own fixed size, and the parent viewport stays clean. */
  iframe { position: absolute; left: 0; top: 0; border: 0; display: block; }
  #sizes { position: fixed; left: 0; bottom: 0; z-index: 5; }
  canvas { display: block; }
  #mirror { position: fixed; right: 0; top: 0; padding: 6px; z-index: 6; }
  #mirror div { max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<div id="frames"></div>
<div id="sizes"></div>
<div id="mirror">
  <div id="clock"></div>
  <div id="tick-clock"></div>
  <div id="scorebug"></div>
  <div id="status"></div>
</div>
<script>
(function () {
  'use strict';

  // A 140-rune note, exactly the server's cap (defaults.MAX_NOTE_RUNES). The
  // 4-byte emoji are there because the server truncates on RUNE boundaries and
  // a byte-boundary bug would surface here as mojibake, not as a crash.
  var CAP = 140;
  function fullCapNote(alias) {
    var body = alias + ' squeezing the north cluster, hulls light, coming home before anyone heavier can reach us \uD83D\uDEA2\uD83E\uDDC2 and razing the far yard next ';
    while (Array.from(body).length < CAP) body += 'x';
    return Array.from(body).slice(0, CAP).join('');
  }

  var SIZES = [[1240, 700], [900, 560], [360, 640]];
  var mirrorIds = ['clock', 'tick-clock', 'scorebug', 'status'];
  var frames = [];
  var canvases = [];
  var failed = false;
  var announced = false;

  function fail(message) {
    if (failed) return;
    failed = true;
    document.documentElement.setAttribute('data-replay-error', String(message));
  }

  SIZES.forEach(function (wh, index) {
    var frame = document.createElement('iframe');
    frame.width = wh[0];
    frame.height = wh[1];
    frame.title = 'cogame-halite replay chrome at ' + wh[0] + 'x' + wh[1];
    frame.style.zIndex = String(SIZES.length - index);
    document.getElementById('frames').appendChild(frame);
    frames.push(frame);

    var canvas = document.createElement('canvas');
    canvas.width = wh[0];
    canvas.height = wh[1];
    canvas.style.width = '110px';
    canvas.style.height = Math.round(110 * wh[1] / wh[0]) + 'px';
    document.getElementById('sizes').appendChild(canvas);
    canvases.push(canvas);
  });

  // One run per LEAF ELEMENT that carries text, at the element's own laid-out
  // box. Character-level Range rects were tried first and are not sound here:
  // they hand back geometry that does not agree with the element's box for
  // right-aligned wrapped rows, which turned every feed line into a phantom
  // "text with nowhere to go" while the geometry note printed a feed band that
  // was demonstrably inside the frame. An element box is a browser guarantee,
  // and it is the thing the gate is actually about -- a caption anchored where
  // there is no room is an element whose BOX is off-frame (cogchemists
  // 2026-08-24: a bubble growing upward from a cog at the top of the arena).
  function elementRuns(root) {
    var doc = root.ownerDocument;
    var css = doc.defaultView.getComputedStyle;
    var out = [];
    var nodes = [root].concat(Array.prototype.slice.call(root.querySelectorAll('*')));
    nodes.forEach(function (el) {
      if (el.children.length) return;                  // leaves only
      var text = (el.textContent || '').replace(/\s+/g, ' ').trim();
      if (!text) return;
      var style = css(el);
      if (style.display === 'none' || style.visibility === 'hidden') return;
      if (parseFloat(style.opacity) === 0) return;
      var box = el.getBoundingClientRect();
      if (!box.width || !box.height) return;
      out.push({
        text: text, left: box.left, right: box.right, bottom: box.bottom, style: style
      });
    });
    return out;
  }

  // Transcribe one page's own text onto its canvas at MEASURED geometry. The
  // canvas IS that iframe's layout viewport, read from INSIDE the iframe, so a
  // run outside the canvas means the page genuinely laid that text outside its
  // own frame.
  function transcribe(doc, canvas) {
    var view = doc.documentElement;
    if (canvas.width !== view.clientWidth || canvas.height !== view.clientHeight) {
      canvas.width = Math.max(1, view.clientWidth);
      canvas.height = Math.max(1, view.clientHeight);
      canvas.style.width = '110px';
      canvas.style.height = Math.round(110 * canvas.height / canvas.width) + 'px';
    }
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#f2e8d8';
    ctx.textBaseline = 'alphabetic';
    var drawn = 0;
    ['#killfeed', '#scorebug', '#clock', '#endcard', '#transport'].forEach(function (host) {
      var root = doc.querySelector(host);
      if (!root) return;
      elementRuns(root).forEach(function (run) {
        var px = parseFloat(run.style.fontSize) || 12;
        var family = run.style.fontFamily || 'sans-serif';
        // The canvas must MEASURE the run exactly as wide as the page LAID IT
        // OUT. The parent document may resolve a different face for the same
        // family list, and a wrapped element occupies its box rather than one
        // long line; scaling the font so the drawn width equals the element's
        // own box width makes the transcription font- and wrap-independent.
        ctx.font = px + 'px ' + family;
        var measured = ctx.measureText(run.text).width || 1;
        var laidOut = Math.max(1, run.right - run.left);
        ctx.font = Math.max(1, px * laidOut / measured) + 'px ' + family;
        ctx.fillText(run.text, run.left, run.bottom);
        drawn++;
      });
    });
    return drawn;
  }

  function injectNotes(doc) {
    // Every seat gets a FULL-CAP note on many turns, so the feed is never
    // empty at whatever turn the fixture samples.
    var aliases = doc.aliases || [];
    var stride = Math.max(1, Math.floor(doc.turns.length / 12));
    doc.turns.forEach(function (rec, index) {
      if (index % stride !== 0) return;
      rec.events = rec.events || [];
      for (var seat = 0; seat < aliases.length; seat++) {
        rec.events.push({
          k: 'note', seat: seat, source: 'llm', latencyMs: 1234,
          text: fullCapNote(aliases[seat])
        });
      }
    });
    return doc;
  }

  var replayParam = new URLSearchParams(location.search).get('replay') || '/smoke.replay';
  fetch(replayParam, { credentials: 'omit' })
    .then(function (response) {
      if (!response.ok) throw new Error('replay fetch returned HTTP ' + response.status);
      return response.text();
    })
    .then(function (text) {
      var doc = injectNotes(JSON.parse(text));
      for (var i = 0; i < doc.turns.length; i++) {
        var events = doc.turns[i].events || [];
        for (var j = 0; j < events.length; j++) {
          if (events[j].k === 'note' && Array.from(events[j].text).length !== CAP) {
            throw new Error('fixture note is not exactly ' + CAP + ' runes');
          }
        }
      }
      var url = URL.createObjectURL(new Blob([JSON.stringify(doc)], { type: 'application/json' }));
      frames.forEach(function (frame) {
        frame.src = './index.html?shim=1&replay=' + encodeURIComponent(url);
      });
    })
    .catch(function (error) { fail(error && error.message ? error.message : String(error)); });

  function innerDoc(frame) {
    try { return frame.contentDocument; } catch (error) { return null; }
  }

  // Measure the SETTLED layout. The inherited chrome slides a feed row in from
  // translateX(30 units) over 250 ms (@keyframes feedin), and a transformed
  // element's client rects are the transformed ones -- an entrance animation is
  // explicitly NOT a defect (viewer_smoke.mjs's own note on --strict-text-bounds
  // says so), so it must not be transcribed as one.
  var stilled = new WeakSet();
  function stillAnimations(doc) {
    if (stilled.has(doc)) return;
    stilled.add(doc);
    var style = doc.createElement('style');
    style.textContent =
      '*, *::before, *::after { animation: none !important; transition: none !important; }';
    doc.head.appendChild(style);
  }

  // One line of geometry per frame, surfaced through #status (which
  // viewer_smoke.mjs prints on failure) so a bounds failure names the layout it
  // happened in instead of leaving it to be guessed.
  function geometryNote(doc) {
    var view = doc.documentElement;
    var stage = doc.getElementById('stage');
    var feed = doc.getElementById('killfeed');
    var row = feed && feed.firstElementChild;
    var css = doc.defaultView.getComputedStyle;
    var stageBox = stage ? stage.getBoundingClientRect() : { width: 0 };
    var feedBox = feed ? feed.getBoundingClientRect() : { left: 0, right: 0 };
    var rowBox = row ? row.getBoundingClientRect() : { left: 0, right: 0 };
    return 'view=' + view.clientWidth + 'x' + view.clientHeight +
      ' stage=' + Math.round(stageBox.width) +
      ' tiny=' + (stage && stage.classList.contains('tiny') ? 1 : 0) +
      ' hudscale=' + (css(view).getPropertyValue('--hudscale') || '?').trim() +
      ' feed=[' + Math.round(feedBox.left) + ',' + Math.round(feedBox.right) + ']' +
      ' row=[' + Math.round(rowBox.left) + ',' + Math.round(rowBox.right) + ']' +
      ' rowfont=' + (row ? css(row).fontSize : '?') +
      ' rowwrap=' + (row ? css(row).whiteSpace : '?');
  }

  setInterval(function () {
    if (failed) return;
    var ready = [];
    for (var i = 0; i < frames.length; i++) {
      var doc = innerDoc(frames[i]);
      if (!doc || !doc.documentElement) return;
      var innerError = doc.documentElement.getAttribute('data-replay-error');
      if (innerError) { fail('shipped page: ' + innerError); return; }
      if (doc.documentElement.getAttribute('data-replay-loaded') !== 'true') return;
      stillAnimations(doc);
      ready.push(doc);
    }

    // The soak reads the clock/tick/scorebug; #status carries the geometry of
    // every frame, so a bounds failure is self-describing.
    mirrorIds.slice(0, 3).forEach(function (id) {
      var node = ready[0].querySelector('#' + id);
      document.getElementById(id).textContent =
        node ? (node.innerText || node.textContent || '').replace(/\s+/g, ' ').trim() : '';
    });
    document.getElementById('status').textContent =
      ready.map(function (doc) { return geometryNote(doc); }).join('  |  ');

    for (var k = 0; k < ready.length; k++) {
      var drawn = transcribe(ready[k], canvases[k]);
      if (drawn === 0) {
        fail('no text runs found in the shipped chrome at ' +
             SIZES[k][0] + 'x' + SIZES[k][1]);
        return;
      }
    }
    if (!announced) {
      announced = true;
      document.documentElement.setAttribute('data-replay-loaded', 'true');
    }
  }, 200);
})();
</script>
</body>
</html>
