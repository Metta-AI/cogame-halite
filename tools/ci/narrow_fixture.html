<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cogame-halite viewer — 360x640 featured-match width</title>
<!--
  The featured-match iframe on softmax.com is ~360 px wide, and that is where
  a scorebug plate name collapses to a bare "…". tools/ci/viewer_smoke.mjs has
  a FIXED 1280x800 browser viewport and takes no size flag, so this fixture is
  how the narrow case is exercised: it loads the SHIPPED
  dist/static-replay-viewer/index.html in a 360x640 iframe and mirrors the
  iframe's load/error attributes and its #clock / #tick-clock / #scorebug text
  onto this page, which is what the harness reads.

  Run (see .github/workflows/ci.yml):
    node tools/ci/viewer_smoke.mjs --url \
      "http://127.0.0.1:8731/narrow_fixture.html?replay=%2Fsmoke.replay" \
      --timeout 90 --strict-text-bounds --soak 8 --out dist/narrow
-->
<style>
  html, body { margin: 0; padding: 0; background: #0b0805; color: #f2e8d8;
               font: 12px/1.4 ui-monospace, Menlo, monospace; }
  #frame-box { width: 360px; height: 640px; border: 0; display: block; }
  #mirror { position: fixed; right: 0; top: 0; padding: 6px; opacity: 0.85; }
  #mirror div { max-width: 40ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<iframe id="frame-box" title="cogame-halite replay at 360x640"></iframe>
<div id="mirror">
  <div id="clock"></div>
  <div id="tick-clock"></div>
  <div id="scorebug"></div>
  <div id="status"></div>
</div>
<script>
(function () {
  'use strict';
  var replay = new URLSearchParams(location.search).get('replay') || '/smoke.replay';
  var frame = document.getElementById('frame-box');
  frame.src = './index.html?replay=' + encodeURIComponent(replay);

  function textOf(doc, selector) {
    var node = doc.querySelector(selector);
    if (!node) return '';
    return (node.innerText || node.textContent || '').replace(/\s+/g, ' ').trim();
  }

  var failed = false;
  setInterval(function () {
    var doc;
    try { doc = frame.contentDocument; } catch (error) { return; }
    if (!doc || !doc.documentElement) return;
    var error = doc.documentElement.getAttribute('data-replay-error');
    if (error && !failed) {
      failed = true;
      document.documentElement.setAttribute('data-replay-error', error);
      return;
    }
    document.getElementById('clock').textContent = textOf(doc, '#clock');
    document.getElementById('tick-clock').textContent = textOf(doc, '#tick-clock');
    document.getElementById('scorebug').textContent = textOf(doc, '#scorebug');
    document.getElementById('status').textContent = textOf(doc, '#status');
    if (doc.documentElement.getAttribute('data-replay-loaded') === 'true') {
      // A plate name that collapsed to a bare ellipsis at 360 px is the whole
      // point of this fixture -- fail loudly instead of shipping it.
      var names = doc.querySelectorAll('.plate-name');
      for (var i = 0; i < names.length; i++) {
        var shown = (names[i].textContent || '').trim();
        var want = (names[i].getAttribute('title') || '').trim();
        if (want && shown && names[i].scrollWidth > 0 && names[i].clientWidth === 0) {
          document.documentElement.setAttribute(
            'data-replay-error', 'plate-name collapsed to zero width at 360px: ' + want);
          return;
        }
      }
      document.documentElement.setAttribute('data-replay-loaded', 'true');
    }
  }, 250);
})();
</script>
</body>
</html>
